# Candidate API runtime; requires separately provisioned PostgreSQL18 and OIDC.
# An authenticated TLS reverse proxy terminates traffic before the loopback port.
services:
  api:
    image: ${QUINCAI_API_IMAGE:?Supply approved image by sha256 digest}
    restart: unless-stopped
    init: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    stop_grace_period: 40s
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      QUINCAI_DATABASE_URL: ${QUINCAI_DATABASE_URL:?Required}
      QUINCAI_DATABASE_USER: ${QUINCAI_DATABASE_USER:?Required}
      QUINCAI_OIDC_ISSUER: ${QUINCAI_OIDC_ISSUER:?Required}
      QUINCAI_OIDC_AUDIENCE: ${QUINCAI_OIDC_AUDIENCE:?Required}
      QUINCAI_MIGRATIONS_ENABLED: "false"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "15"
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: "5000"
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30s
    secrets:
      - QUINCAI_DATABASE_PASSWORD
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
secrets:
  QUINCAI_DATABASE_PASSWORD:
    file: ${QUINCAI_DATABASE_PASSWORD_FILE:?Required outside repository}
