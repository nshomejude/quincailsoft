# Example only. Keep this collector and API endpoint on a private network.
# One explicitly consented synthetic scope per job; never enumerate tenants.
global:
  scrape_interval: 30s
  scrape_timeout: 5s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: quincai-synthetic-scope
    scheme: https
    metrics_path: /api/v1/observability/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_bearer
    static_configs:
      - targets: ['api.internal.example:443']
