name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web apps (typecheck, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: |
          pnpm --filter @quincaisoft/web-admin typecheck
          pnpm --filter @quincaisoft/platform-admin typecheck
          pnpm --filter @quincaisoft/merchant-storefront typecheck
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          pnpm --filter @quincaisoft/web-admin build
          pnpm --filter @quincaisoft/platform-admin build
          pnpm --filter @quincaisoft/merchant-storefront build
      - name: web-admin tests
        run: pnpm --filter @quincaisoft/web-admin test

  backend:
    name: Backend (mvn verify, Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: mvn verify
        working-directory: backend
        run: ./mvnw -B -ntp verify

  compose:
    name: Production compose file is valid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        working-directory: infrastructure/prod
        run: |
          # Fill every empty placeholder with a dummy value; this only checks structure.
          sed 's/=$/=ci-placeholder/' .env.prod.example > /tmp/ci.env
          docker compose --env-file /tmp/ci.env config --quiet
