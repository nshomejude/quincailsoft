name: Project rules and migration parity
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  project-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check mandatory project rules
        run: node scripts/check-project-rules.mjs
      - name: Check full source inventory is current
        run: node scripts/inventory-python-parity.mjs --check
  full-parity:
    # Migration branches may checkpoint incomplete work; main/releases may not.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enforce every required migrated behavior
        run: node scripts/check-python-java-parity.mjs
